[project]
name = "canlah-healthcheck"
version = "0.1.0"
description = "Canlah website healthcheck exercise"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
canlah-healthcheck = "canlah_healthcheck.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canlah_healthcheck"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
